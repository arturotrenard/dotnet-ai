# Exposes the `dapr run` shell's environment variables as secrets, so API keys
# (e.g. OLLAMA_API_KEY for conversation-ollama.yaml) never live in this repo.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: envvar-secretstore
spec:
  type: secretstores.local.env
  version: v1
  metadata: []
